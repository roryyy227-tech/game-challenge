<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معركة القوى: تحدي الفرق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A140F; --panel:#122019; --panel2:#17291F; --ink:#EEF5EF; --ink-soft:#88A395;
    --gold:#E8871E; --teal:#3FA96B; --line:#22392C; --danger:#E0685A;
    --radius:16px;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:#0A140F; }
  *{box-sizing:border-box;}
  body{ margin:0; background-color:#0A140F; background-image:radial-gradient(ellipse at top,#152A1F 0%,#0A140F 65%); color:var(--ink);
        font-family:'Tajawal','Segoe UI',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:820px; margin:0 auto; padding:20px 16px 50px; }
  .screen{ display:none; animation:fade .35s ease; }
  .screen.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .head{ text-align:center; margin-bottom:18px; }
  .head h1{ font-size:24px; font-weight:900; margin:0 0 6px; color:var(--gold); }
  .head p{ font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.8; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }

  /* SETUP */
  .team-count-row{ display:flex; gap:8px; margin-bottom:16px; }
  .tc-btn{ flex:1; padding:12px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel2); text-align:center;
    font-size:14px; font-weight:800; color:var(--ink-soft); cursor:pointer; }
  .tc-btn.sel{ border-color:var(--gold); color:var(--gold); background:#2E2110; }
  .team-inputs{ display:grid; gap:10px; margin-bottom:16px; }
  .team-input-row{ display:flex; align-items:center; gap:10px; }
  .team-swatch{ width:26px; height:26px; border-radius:50%; flex-shrink:0; }
  .team-input-row input{ flex:1; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit; font-size:14px; }
  .start-btn{ width:100%; background:var(--gold); color:#2A2413; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:900; font-family:inherit; cursor:pointer; }

  /* BOARD */
  .scoreboard{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .score-card{ flex:1; min-width:120px; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:10px 12px; text-align:center; transition:border-color .3s, transform .3s; }
  .score-card .sc-name{ font-size:12px; font-weight:800; margin-bottom:4px; }
  .score-card .sc-val{ font-size:22px; font-weight:900; }
  .score-card.bump{ animation:bump .5s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 30%{transform:scale(1.12);} 100%{transform:scale(1);} }

  /* شبكة الأزرار مرتبة بشكل عمودي ومتناسق */
  .board{ 
    display:grid; 
    grid-template-columns: repeat(2, 1fr); 
    gap:10px; 
    margin-bottom:18px; 
  }
  .cell{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 4px; text-align:center; font-size:18px; font-weight:900; color:var(--gold); cursor:pointer; transition:transform .12s, background .2s; }
  .cell:hover{ transform:scale(1.04); background:var(--panel2); }
  .cell.used{ background:transparent; color:var(--line); cursor:default; pointer-events:none; opacity:.35; }

  .end-btn{ width:100%; background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:12px; padding:12px; font-size:12.5px; font-family:inherit; cursor:pointer; }

  /* QUESTION MODAL */
  .modal-overlay{ position:fixed; inset:0; background:rgba(6,9,15,.88); z-index:70; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.show{ display:flex; }
  .modal-card{ background:var(--panel); border:1px solid var(--gold); border-radius:18px; padding:26px 22px; max-width:480px; width:100%;
    animation:flipin .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes flipin{ from{transform:scale(.8) rotateX(20deg); opacity:0;} to{transform:scale(1) rotateX(0); opacity:1;} }
  .modal-kicker{ text-align:center; font-size:12px; color:var(--teal); font-weight:800; margin-bottom:6px; }
  .modal-points{ text-align:center; font-size:30px; font-weight:900; color:var(--gold); margin-bottom:16px; }
  .modal-q{ font-size:16px; font-weight:700; line-height:1.8; margin-bottom:18px; text-align:center; }
  .reveal-box{ background:var(--bg); border:1px dashed var(--line); border-radius:12px; padding:12px; font-size:12.5px; color:var(--ink-soft); line-height:1.8; margin-bottom:16px; display:none; }
  .reveal-box.show{ display:block; }
  .reveal-btn{ width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px; font-size:13px; font-family:inherit; cursor:pointer; margin-bottom:14px; }
  .award-label{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-bottom:8px; }
  .award-grid{ display:grid; gap:8px; }
  .award-btn{ border:none; border-radius:10px; padding:12px; font-size:13.5px; font-weight:800; color:#08101A; cursor:pointer; font-family:inherit; }
  .no-award{ width:100%; margin-top:8px; background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:10px; padding:10px; font-size:12px; font-family:inherit; cursor:pointer; }

  .particle{ position:fixed; border-radius:50%; pointer-events:none; z-index:80; }

  /* FINAL */
  .final-wrap{ text-align:center; }
  .trophy{ font-size:56px; margin-bottom:10px; }
  .winner-name{ font-size:24px; font-weight:900; color:var(--gold); margin-bottom:6px; }
  .final-list{ display:grid; gap:8px; margin:20px 0; }
  .final-row{ display:flex; justify-content:space-between; background:var(--panel2); border-radius:10px; padding:10px 14px; font-size:13px; font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>⚔️ معركة القوى: تحدي الفرق</h1>
    <p id="headSub">فرق تتنافس على فهم القوى المؤثرة في التعليم — كل سؤال أصعب يعطي نقاط أكثر</p>
  </div>

  <!-- SETUP -->
  <section class="screen active" id="setup">
    <div class="panel">
      <div class="team-count-row">
        <div class="tc-btn sel" data-n="2" onclick="setTeamCount(2)">فريقين</div>
        <div class="tc-btn" data-n="3" onclick="setTeamCount(3)">٣ فرق</div>
        <div class="tc-btn" data-n="4" onclick="setTeamCount(4)">٤ فرق</div>
      </div>
      <div class="team-inputs" id="teamInputs"></div>
      <button class="start-btn" onclick="startGame()">ابدئي المعركة 🚀</button>
    </div>
  </section>

  <!-- BOARD -->
  <section class="screen" id="board">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="board" id="boardGrid"></div>
    <button class="end-btn" onclick="showFinal()">إنهاء اللعبة وإعلان الفائز 🏆</button>
  </section>

  <!-- FINAL -->
  <section class="screen" id="final">
    <div class="panel final-wrap">
      <div class="trophy">🏆</div>
      <div class="winner-name" id="winnerName"></div>
      <p style="color:var(--ink-soft);font-size:13px">أقوى فريق بفهم القوى المؤثرة في التعليم!</p>
      <div class="final-list" id="finalList"></div>
      <button class="start-btn" onclick="restartAll()">لعبة جديدة</button>
    </div>
  </section>
</div>

<!-- QUESTION MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-kicker" id="modalCat"></div>
    <div class="modal-points" id="modalPoints"></div>
    <div class="modal-q" id="modalQ"></div>
    <div class="reveal-box" id="revealBox"></div>
    <button class="reveal-btn" id="revealBtn" onclick="revealHint()">💡 عرض نقطة مساعدة للنقاش</button>
    <div class="award-label">أي فريق جاوب صح؟ اضغطي لتمنحيه النقاط</div>
    <div class="award-grid" id="awardGrid"></div>
    <button class="no-award" onclick="closeModal()">ولا فريق — تخطي بدون نقاط</button>
  </div>
</div>

<script>
const TEAM_COLORS=['#3FA96B','#E8871E','#2E7D53','#D9A441'];
let teamCount=2;

function setTeamCount(n){
  teamCount=n;
  document.querySelectorAll('.tc-btn').forEach(b=>b.classList.toggle('sel',+b.dataset.n===n));
  renderTeamInputs();
}

function renderTeamInputs(){
  const wrap=document.getElementById('teamInputs');
  wrap.innerHTML='';
  for(let i=0;i<teamCount;i++){
    const row=document.createElement('div'); row.className='team-input-row';
    const sw=document.createElement('div'); sw.className='team-swatch'; sw.style.background=TEAM_COLORS[i];
    const inp=document.createElement('input'); inp.placeholder='اسم الفريق '+(i+1); inp.id='teamName'+i;
    row.appendChild(sw); row.appendChild(inp);
    wrap.appendChild(row);
  }
}
renderTeamInputs();

// الأسئلة الـ 10 الخاصة بك كاملة ومصنفة حسب النقاط
const QUESTIONS = [
  // 100 نقطة
  { pts: 100, q: 'لو كان بإمكانك إضافة عامل سابع إلى العوامل المؤثرة في النظام التعليمي السعودي, فما العامل الذي ستضيفينه؟ ولماذا؟', hint: 'نقاش تحليلي مبتكر — قيّمي منطقية العامل المضاف وقوة تبريره' },
  { pts: 100, q: 'تخيلي أن التعليم لا يستطيع أن يتجاهل عاملاً واحداً من هذه العوامل مهما تغيرت الظروف: أي عامل سيكون؟ ولماذا؟', hint: 'نقاش حول العامل الأساسي — قيّمي حجّة ودفاع الفريق' },

  // 200 نقطة
  { pts: 200, q: 'لو طلب منك تفسير سبب اختلاف بعض جوانب التعليم بين الماضي والحاضر باستخدام عامل واحد فقط, أي عامل ستختارين؟', hint: 'ربط تاريخي وتحليلي — قيّمي اختيار العامل والربط بالواقع' },
  { pts: 200, q: 'لو اتفقنا أن العوامل الستة مترابطة, فأي عامل ترين أنه قد يبدأ منه التغيير ثم ينتقل أثره إلى بقية العوامل؟ ولماذا؟', hint: 'تفكير النظم والشرارة الأولى للتغيير — قيّمي تتبع أثر التغير المتسلسل' },

  // 300 نقطة
  { pts: 300, q: 'لو كنتي مسؤولة عن تطوير التعليم, وأُتيح لك اختيار جهد واحد فقط من جهود المملكة السابقة, فأي جهد ستختارين؟ ولماذا؟', hint: 'تقييم جهود تطوير التعليم — قيّمي وضوح الاختيار والسبب' },
  { pts: 300, q: 'برأيك, أيّهما أكثر تأثيراً في تطوير التعليم: تطوير المناهج أم تطوير المعلمين؟ ولماذا؟', hint: 'مقارنة بين ركنين أساسيين — قيّمي التبرير وإقناع الإجابة' },

  // 400 نقطة
  { pts: 400, q: 'تخيلي مدرسة في قرية نائية ومدرسة في مدينة كبيرة؛ هل تتوقعين أن تكون احتياجاتهما التعليمية متطابقة؟ ولماذا؟', hint: 'تحليل الفروق والاحتياجات المحلية — قيّمي العمق والواقعية' },
  { pts: 400, q: 'برأيك, أيّهما يؤثر في الآخر أكثر: المجتمع في التعليم أم التعليم في المجتمع؟ ولماذا؟', hint: 'علاقة تبادلية بين التعليم والمجتمع — قيّمي اتجاه التأثير المختار' },

  // 500 نقطة
  { pts: 500, q: 'اختاري عاملاً واحداً من العوامل الستة, وتخيلي أنه اختفى تماماً من المجتمع السعودي... كيف سيتغير التعليم؟', hint: 'سيناريو تخيلي لغياب أحد العوامل — قيّمي عمق النتائج المتوقعة' },
  { pts: 500, q: 'لو طلب منك تحديد العامل الأكثر تأثيراً في تشكيل النظام التعليمي السعودي, أي عامل ستختارين؟ وما السبب؟', hint: 'تحديد العامل القيادي المحرك — قيّمي قوة الحجة والسبب' }
];

let teams=[];
function startGame(){
  teams=[];
  for(let i=0;i<teamCount;i++){
    const name=document.getElementById('teamName'+i).value.trim() || ('فريق '+(i+1));
    teams.push({ name, color:TEAM_COLORS[i], score:0 });
  }
  go('board');
  renderScoreboard();
  renderBoard();
}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function renderScoreboard(){
  const sb=document.getElementById('scoreboard');
  sb.innerHTML='';
  teams.forEach((t,i)=>{
    const c=document.createElement('div'); c.className='score-card'; c.id='scoreCard'+i;
    c.style.borderColor=t.color;
    c.innerHTML='<div class="sc-name" style="color:'+t.color+'">'+t.name+'</div><div class="sc-val" id="scoreVal'+i+'">0</div>';
    sb.appendChild(c);
  });
}

function renderBoard(){
  const grid=document.getElementById('boardGrid');
  grid.innerHTML='';
  QUESTIONS.forEach((q, index) => {
    const cell=document.createElement('div');
    cell.className='cell';
    cell.textContent=q.pts;
    cell.id='cell-'+index;
    cell.onclick=()=>openQuestion(index);
    grid.appendChild(cell);
  });
}

let activeIndex=null;
function openQuestion(index){
  const q=QUESTIONS[index];
  activeIndex=index;
  document.getElementById('modalCat').textContent='سؤال ' + (index+1);
  document.getElementById('modalPoints').textContent=q.pts + ' نقطة';
  document.getElementById('modalQ').textContent=q.q;
  
  const rb=document.getElementById('revealBox'); 
  rb.classList.remove('show'); 
  rb.textContent=q.hint;
  
  document.getElementById('revealBtn').style.display='block';
  const ag=document.getElementById('awardGrid'); 
  ag.innerHTML='';
  
  teams.forEach((t,i)=>{
    const b=document.createElement('button'); 
    b.className='award-btn'; 
    b.style.background=t.color;
    b.textContent='🏅 '+t.name;
    b.onclick=()=>award(i,q.pts);
    ag.appendChild(b);
  });
  
  document.getElementById('modalOverlay').classList.add('show');
}

function revealHint(){
  document.getElementById('revealBox').classList.add('show');
  document.getElementById('revealBtn').style.display='none';
}

function award(teamIdx,pts){
  teams[teamIdx].score+=pts;
  document.getElementById('scoreVal'+teamIdx).textContent=teams[teamIdx].score;
  const card=document.getElementById('scoreCard'+teamIdx);
  card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump');
  burst(card);
  closeModal();
}

function closeModal(){
  if(activeIndex !== null){
    const c=document.getElementById('cell-'+activeIndex);
    if(c){
      c.classList.add('used'); 
      c.textContent='✓';
    }
  }
  document.getElementById('modalOverlay').classList.remove('show');
  activeIndex=null;
}

function burst(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const colors=['#E8871E','#3FA96B','#EEF5EF'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div'); p.className='particle';
    const sz=4+Math.random()*4;
    p.style.width=sz+'px'; p.style.height=sz+'px';
    p.style.left=cx+'px'; p.style.top=cy+'px';
    p.style.background=colors[i%colors.length];
    document.body.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=50+Math.random()*80;
    p.animate([
      {transform:'translate(0,0)', opacity:1},
      {transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`, opacity:0}
    ],{duration:700+Math.random()*300, easing:'ease-out'});
    setTimeout(()=>p.remove(),1100);
  }
}

function showFinal(){
  go('final');
  const sorted=[...teams].sort((a,b)=>b.score-a.score);
  document.getElementById('winnerName').textContent=sorted[0].name+' 🎉';
  const list=document.getElementById('finalList');
  list.innerHTML='';
  sorted.forEach((t,i)=>{
    const row=document.className='final-row';
    const r=document.createElement('div'); r.className='final-row';
    r.style.borderRight='4px solid '+t.color;
    r.innerHTML='<span>'+(i+1)+'. '+t.name+'</span><span>'+t.score+' نقطة</span>';
    list.appendChild(r);
  });
  if(sorted[0].score>0) burst(document.querySelector('.trophy'));
}

function restartAll(){
  go('setup');
}
</script>
</body>
</html>
